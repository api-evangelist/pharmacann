aid: pharmacann
name: PharmaCann
description: >-
  PharmaCann is one of the largest vertically integrated cannabis companies in the United States,
  founded in 2014 and operating cultivation centers, processing facilities and retail dispensaries
  across eight states — Colorado, Illinois, Maryland, Massachusetts, Michigan, New York, Ohio and
  Pennsylvania. The company runs nine cultivation and processing facilities (Denver CO, Dwight IL,
  Lothian and Stevensville MD, Holliston MA, Warren MI, Hamptonburgh NY, Buckeye Lake OH and
  Olyphant PA) and sells through two retail banners, LivWell (Colorado and Michigan) and Verilife
  (Illinois, Maryland, Massachusetts, Michigan, New York, Ohio and Pennsylvania), alongside a house
  of product brands including Matter, Magnitude, Full Melt, CAM, P3, LivWell Flower, Hash and
  PC Nursery. PharmaCann is a physical-goods operator in a federally restricted, state-regulated
  industry; it publishes no developer program, no public API and no machine-readable API contract.
